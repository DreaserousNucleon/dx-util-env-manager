project_name: de

before:
  hooks:
    - go mod tidy

builds:
  - id: de
    main: ./cmd/internal
    binary: de
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X dx-util-env-manager/internal/version.Version={{.Version}}
      - -X dx-util-env-manager/internal/version.Commit={{.Commit}}
      - -X dx-util-env-manager/internal/version.BuildDate={{.Date}}

archives:
  - id: default
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
